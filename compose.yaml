services:
  db:
    image: postgres:17-alpine
    container_name: communicates-db
    environment:
      POSTGRES_DB: ${DB_NAME:-communicates}
      POSTGRES_USER: ${DB_USERNAME:-communicates}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-communicates}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-communicates} -d ${DB_NAME:-communicates}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
